<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Аспазға көмектес! — 20 тапсырма</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Times New Roman",Times,serif;font-weight:900;background:#85cffa;color:#162b5e}main{max-width:1400px;min-height:100vh;margin:auto;background:linear-gradient(#ffffff20,#ffffff20),url(kitchen.jpg) center/cover;display:flex;flex-direction:column;padding:12px 16px 16px;gap:10px}.header{display:flex;gap:14px;align-items:center;justify-content:space-between}.banner{background:linear-gradient(#ffe9a0,#ffc46e);border:5px solid #9c521c;border-radius:20px;box-shadow:0 5px 0 #713914;padding:8px 20px;text-align:center;flex:1}.banner h1{color:#d51616;text-shadow:2px 2px white;font-size:clamp(24px,3.6vw,48px);margin:0}.banner p{font-weight:900;color:#9b211a;font-size:clamp(12px,1.6vw,21px);margin:5px}.count{background:#064c35;color:white;border:7px solid #b9792c;border-radius:14px;font-weight:900;font-size:clamp(18px,2.6vw,31px);padding:15px;text-align:center;min-width:140px}.middle{display:grid;grid-template-columns:minmax(135px,23%) 1fr;gap:10px;align-items:center;flex:1;min-height:0}.chef{width:100%;max-height:540px;object-fit:contain;object-position:center bottom;align-self:end;border-radius:25px}.work{display:flex;flex-direction:column;gap:12px}.problem{background:#f9fffff5;border:8px solid #a7e9ff;border-radius:35px;box-shadow:0 5px 0 #167bd4;padding:18px 12px;text-align:center}.pics{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}.pics.dense{gap:3px}.pics.dense .produce{width:clamp(34px,4.4vw,62px);height:clamp(34px,4.4vw,62px)}.pics.dense .sign{font-size:clamp(18px,2.3vw,32px)}.produce{width:clamp(65px,9vw,135px);height:clamp(65px,9vw,135px);object-fit:contain;background:white;border-radius:15px}.sign{font-size:clamp(28px,4vw,65px);color:#e1160d;font-weight:900}.sum{font-size:clamp(22px,3vw,42px);font-weight:900;color:#162e86;margin-top:12px}.prompt{text-align:center;font-size:clamp(17px,2vw,25px);font-weight:900;color:#fff;text-shadow:1px 2px 4px #164469}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer{min-height:100px;border:5px solid white;border-radius:28px;background:linear-gradient(#fff8ca,#ffd45a);box-shadow:0 5px 0 #c96e16;font-size:clamp(20px,2.8vw,39px);font-weight:900;color:#182d8a;cursor:pointer;touch-action:manipulation}.answer:active{transform:translateY(3px)}.answer.good{background:linear-gradient(#d6ff81,#6be500);box-shadow:0 5px 0 #298d16}.answer.bad{background:linear-gradient(#ffb5a5,#ff6756)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.feedback{background:#ffffffef;border:5px solid #3eb521;border-radius:30px;color:#e1171b;font-size:clamp(18px,3vw,35px);font-weight:900;min-height:75px;display:flex;align-items:center;justify-content:center;flex:1;text-align:center}.next{background:linear-gradient(#3aaaff,#064bd7);color:white;border:5px solid white;border-radius:25px;font-size:clamp(20px,2.5vw,34px);font-weight:900;padding:17px 26px;cursor:pointer;box-shadow:0 5px 0 #0843a1}.next:disabled{opacity:.45;cursor:not-allowed}.steps{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.step{background:#fff;border:2px solid #a2a2a2;border-radius:50%;height:clamp(28px,3.2vw,46px);width:clamp(28px,3.2vw,46px);display:grid;place-items:center;font-size:clamp(12px,1.5vw,19px);font-weight:900}.step.done{background:#70e02c}.step.now{background:#ffe66b;border-color:#e39406}.finish{display:none;text-align:center;background:#fffdf2ed;border-radius:30px;padding:30px;font-size:30px;font-weight:bold}.finish button{font-size:25px;padding:16px 30px;background:#28a8ff;border:0;border-radius:20px;color:white;cursor:pointer}@media(max-width:720px){main{padding:7px;gap:7px}.count{min-width:80px;padding:6px;border-width:3px}.banner{border-width:3px;padding:5px}.middle{grid-template-columns:24% 1fr}.chef{max-height:320px}.problem{padding:9px 5px;border-width:4px;border-radius:17px}.pics.dense{gap:3px}.pics.dense .produce{width:clamp(34px,4.4vw,62px);height:clamp(34px,4.4vw,62px)}.pics.dense .sign{font-size:clamp(18px,2.3vw,32px)}.produce{width:clamp(36px,11vw,65px);height:clamp(36px,11vw,65px)}.pics{gap:3px}.sign{font-size:25px}.sum{font-size:22px}.answers{gap:4px}.answer{min-height:60px;border-width:2px;border-radius:12px;font-size:clamp(13px,3.2vw,22px)}.feedback{min-height:55px;border-width:3px}.next{padding:10px;border-width:3px}.work{gap:6px}}
button{font-family:"Times New Roman",Times,serif;font-weight:900} 
/* Телефонға арнайы кең, ықшам көрініс */
@media (max-width:720px){
 html,body{width:100%;overflow-x:hidden}
 main{width:100%;max-width:none;min-height:100dvh;padding:7px 7px 12px;gap:8px;background-position:center;background-size:cover}
 .header{gap:5px;align-items:stretch}
 .banner{padding:6px 4px;border-width:3px;border-radius:14px;min-width:0}
 .banner h1{font-size:clamp(24px,6.5vw,34px);line-height:1.03}
 .banner p{font-size:clamp(14px,3.5vw,19px);line-height:1.08;margin:4px 0 0}
 .count{min-width:67px;padding:5px 3px;font-size:clamp(14px,3.7vw,20px);border-width:3px;line-height:1.15}
 .middle{display:flex!important;flex-direction:column;align-items:stretch;justify-content:flex-start;flex:0 0 auto;gap:5px;width:100%}
 .chef{display:block;width:100px;height:100px;max-height:100px;object-fit:contain;align-self:center;flex:0 0 auto;margin:0 auto}
 .work{display:flex;gap:9px;width:100%}
 .problem{width:100%;padding:12px 5px;border-width:4px;border-radius:18px}
 .pics{gap:4px;justify-content:center}
 .produce,.pics.dense .produce{width:clamp(37px,10vw,56px);height:clamp(37px,10vw,56px);border-radius:9px}
 .sign,.pics.dense .sign{font-size:clamp(20px,5.4vw,28px)}
 .sum{font-size:clamp(23px,6vw,33px);line-height:1.3;margin-top:9px;overflow-wrap:anywhere}
 .prompt{font-size:clamp(21px,5.4vw,29px);line-height:1.15}
 .answers{grid-template-columns:1fr;gap:8px}
 .answer{min-height:64px;width:100%;border-width:3px;border-radius:17px;font-size:clamp(27px,7.3vw,38px);box-shadow:0 3px 0 #c96e16}
 .bottom{gap:7px;align-items:stretch}
 .feedback{min-height:64px;border-width:3px;border-radius:15px;font-size:clamp(19px,5vw,26px);padding:4px;line-height:1.12}
 .next{min-width:105px;padding:8px 5px;border-width:3px;border-radius:15px;font-size:clamp(19px,5vw,26px)}
 .steps{gap:4px;padding-top:3px}
 .step{height:29px;width:29px;font-size:14px;border-width:2px}
 .finish{font-size:26px;padding:16px}
}
@media (min-width:540px) and (max-width:720px){.answers{grid-template-columns:repeat(3,minmax(0,1fr))}.answer{font-size:clamp(18px,3.8vw,27px)}}
</style></head><body><main><div class="header"><div class="banner"><h1>👨‍🍳 Аспазға көмектес!</h1><p>Бірдей қосылғыштарды көбейтіндіге айналдыр!</p></div><div class="count"><span id="count">1 / 20</span><br>тапсырма</div></div><div class="middle" id="game"><img class="chef" src="chef.webp" alt="Қасық ұстаған аспаз"><div class="work"><div class="problem"><div class="pics" id="pics"></div><div class="sum" id="sum"></div></div><div class="prompt">Дұрыс көбейтіндіні таңда!</div><div class="answers" id="answers"></div><div class="bottom"><div class="feedback" id="feedback">Аспазға көмектес! 🍲</div><button class="next" id="next" disabled>Келесі ❯</button></div></div></div><div class="finish" id="finish">🎉 Жарайсың! 20 тапсырманы орындадың!<p>👨‍🍳 Аспаздың мерекелік дастарханы дайын! 🍲🥗🍉</p><button onclick="start()">Қайта ойнау ↻</button></div><div class="steps" id="steps"></div></main><script>
const data=[{"name": "Алмұрт", "img": "img01.webp", "v": 2, "n": 3}, {"name": "Қызанақ", "img": "img02.webp", "v": 3, "n": 2}, {"name": "Жүзім", "img": "img03.webp", "v": 4, "n": 2}, {"name": "Сәбіз", "img": "img04.webp", "v": 2, "n": 4}, {"name": "Банан", "img": "img05.webp", "v": 3, "n": 4}, {"name": "Шие", "img": "img06.webp", "v": 2, "n": 5}, {"name": "Қарбыз", "img": "img07.webp", "v": 7, "n": 6}, {"name": "Пияз", "img": "img08.webp", "v": 8, "n": 8}, {"name": "Анар", "img": "img09.webp", "v": 9, "n": 6}, {"name": "Қырыққабат", "img": "img10.webp", "v": 5, "n": 6}, {"name": "Апельсин", "img": "img11.webp", "v": 4, "n": 9}, {"name": "Картоп", "img": "img12.webp", "v": 2, "n": 8}, {"name": "Шабдалы", "img": "img13.webp", "v": 8, "n": 7}, {"name": "Шалқан", "img": "img14.webp", "v": 9, "n": 5}, {"name": "Лимон", "img": "img15.webp", "v": 9, "n": 2}, {"name": "Болгар бұрышы", "img": "img16.webp", "v": 10, "n": 2}, {"name": "Алма", "img": "img17.webp", "v": 7, "n": 3}, {"name": "Баклажан", "img": "img18.webp", "v": 8, "n": 3}, {"name": "Қауын", "img": "img19.webp", "v": 9, "n": 3}, {"name": "Алхоры", "img": "img20.webp", "v": 10, "n": 3}];
let order=[],pos=0,solved=false,ctx;
function sound(ok){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;[0,1].forEach((k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=ok?(660+k*220):(240-k*65);g.gain.setValueAtTime(.0001,t+k*.12);g.gain.exponentialRampToValueAtTime(.11,t+k*.12+.012);g.gain.exponentialRampToValueAtTime(.0001,t+k*.12+.17);o.connect(g).connect(ctx.destination);o.start(t+k*.12);o.stop(t+k*.12+.18)})}catch(e){}}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(){order=shuffle([...data]);pos=0;document.getElementById('game').style.display='grid';document.getElementById('finish').style.display='none';render()}
function render(){solved=false;const q=order[pos];document.getElementById('count').textContent=(pos+1)+' / 20';document.getElementById('feedback').textContent='Аспазға көмектес! 🍲';document.getElementById('next').disabled=true;document.getElementById('pics').classList.toggle('dense',q.n>=6);document.getElementById('pics').innerHTML=Array.from({length:q.n},(_,i)=>(i?'<span class="sign">+</span>':'')+'<img class="produce" src="'+q.img+'" alt="'+q.name+'">').join('')+'<span class="sign">= '+(q.v*q.n)+'</span>';document.getElementById('sum').textContent=Array(q.n).fill(q.v).join(' + ')+' = '+(q.v*q.n);
const correct=q.v+' × '+q.n+' = '+(q.v*q.n);const candidates=[correct];for(const [v,n] of [[q.n,q.v],[q.v,q.n+1],[q.v+1,q.n],[q.v,q.n-1],[q.v+2,q.n]]){const s=v+' × '+n+' = '+(v*n);if(!candidates.includes(s)&&candidates.length<3)candidates.push(s)}
const a=document.getElementById('answers');a.innerHTML='';shuffle(candidates).forEach(s=>{const b=document.createElement('button');b.className='answer';b.textContent=s;b.onclick=()=>{if(solved)return;if(s===correct){solved=true;b.classList.add('good');document.getElementById('feedback').textContent='✅ ЖАРАЙСЫҢ!';document.getElementById('next').disabled=false;sound(true);renderSteps()}else{b.classList.add('bad');document.getElementById('feedback').textContent='Қайта ойланып көр!';sound(false);setTimeout(()=>b.classList.remove('bad'),650)}};a.append(b)});renderSteps()}
function renderSteps(){document.getElementById('steps').innerHTML=order.map((_,i)=>'<span class="step '+(i<pos||(i===pos&&solved)?'done':i===pos?'now':'')+'">'+(i+1)+'</span>').join('')}
document.getElementById('next').onclick=()=>{if(!solved)return;pos++;if(pos===order.length){document.getElementById('game').style.display='none';document.getElementById('finish').style.display='block';document.getElementById('count').textContent='20 / 20';return}render()};start();
</script></body></html>
